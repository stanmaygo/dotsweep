name: ci

# Packaging only. There is no engine in this repo to test — the skill calls the
# hosted API — so what can break here is frontmatter, a version, or the symlink,
# and every one of those fails silently at install time rather than loudly.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # This machine's default git identity belongs to a different account, and a
  # clone made to cut a release inherits it. That published a commit under the
  # wrong person once; the amend was two minutes behind the push. A local
  # `user.email` is the fix and this is the thing that notices when it is missing.
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - name: every commit is authored by the owner
        run: |
          bad="$(git log --format='%H %ae' -50 | grep -v ' stanislav.mayorov@me.com$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::commits authored by someone other than the repo owner:"
            echo "$bad"
            echo "fix: git config user.email stanislav.mayorov@me.com, then amend"
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-package.py
      # Both paths hold the prompt, and neither is a symlink: raw.githubusercontent
      # serves a link's target as the body, so a published symlink is a 24-byte
      # path string to anything that reads it without cloning. validate-package.py
      # compares the two; this asserts the shape it cannot see — that they are
      # regular files, and that skills/ holds exactly one skill to discover.
      - name: the published files must be files, not links
        run: |
          test ! -L SKILL.md   || { echo "SKILL.md must not be a symlink";  exit 1; }
          test ! -L AGENTS.md  || { echo "AGENTS.md must not be a symlink"; exit 1; }
          test "$(find skills -name SKILL.md | wc -l)" -eq 1
      - name: the plugin manifests must parse
        run: |
          python3 -c "import json;json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json;json.load(open('.claude-plugin/marketplace.json'))"

  # The action calls the live API, so this is the one job that can fail for a
  # reason outside the repo. It is worth it: nothing else notices when a
  # response shape changes underneath the classifier, and the failure mode of
  # that is a name reported registrable when it is not.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          domains: google.com shoes.nike
          tlds: ''
      # google.com is registered and .nike is a closed brand TLD. Neither may
      # ever appear in `available` — a .brand answers RDAP with a real not-found,
      # which is what made `shoes.nike` read as free before the verdict ranked
      # `closed` above `status`.
      - name: a registered name and a brand TLD are never available
        run: |
          test "${{ steps.check.outputs.available-count }}" -eq 0
          test "${{ steps.check.outputs.taken }}" = "google.com"
          test "${{ steps.check.outputs.closed }}" = "shoes.nike"
      - name: an unreachable API fails the step rather than answering
        run: |
          if bash scripts/action-check.sh; then echo "did not fail"; exit 1; fi
          test ! -s "$GITHUB_OUTPUT_PROBE"
        env:
          INPUT_DOMAINS: anything.com
          INPUT_API: https://dotsweep-unreachable.invalid
          GITHUB_OUTPUT: ${{ runner.temp }}/probe.txt
          GITHUB_OUTPUT_PROBE: ${{ runner.temp }}/probe.txt
          GITHUB_STEP_SUMMARY: ''
